syntax = "proto3";

option go_package = "./grpc";

package grpc;

service AgreementService {
  rpc Request(AgreementReq) returns (AgreementRes);
}

message AgreementReq {
  int64 process_id = 1;
  int64 lamport = 2;
}

// By definition then the AgreementRes is a "granted permission", so the message is purely for decoration
message AgreementRes {
  string message = 1;
}